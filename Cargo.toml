[package]
name = "rustingraft"
version = "0.1.0"
edition = "2021"

[dependencies]
rusting_engine = { path = "../RustingEngine", default-features = false, features = ["ui"] }
raft_sim = { path = "sim" }
raft_relay = { path = "relay" }
raft_net = { path = "net" }
serde = { version = "1", features = ["derive"] }

[workspace]
members = ["sim", "relay", "net"]

# Debug builds of the engine are too slow to play: optimize dependencies
# and keep the game's own code quick to rebuild.
[profile.dev.package."*"]
opt-level = 3
